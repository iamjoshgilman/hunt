name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  logic:
    name: logic (mocked, ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Parse check
        shell: pwsh
        run: |
          $errs = $null; $toks = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./hunt.ps1), [ref]$toks, [ref]$errs) | Out-Null
          if ($errs) {
            $errs | ForEach-Object { "line $($_.Extent.StartLineNumber): $($_.Message)" }
            throw "$($errs.Count) parse error(s)"
          }
          "parse OK - $($toks.Count) tokens"

      - name: Unit, search and discovery tests
        shell: pwsh
        run: ./tests/run.ps1

      - name: Play catalogue tests
        shell: pwsh
        run: ./tests/plays.ps1

  windows:
    name: real event logs (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # Windows PowerShell 5.1 first: it is what the target hosts actually run.
      - name: Mocked suites (Windows PowerShell 5.1)
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./tests/run.ps1

      - name: Play catalogue (Windows PowerShell 5.1)
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./tests/plays.ps1

      - name: Live event log smoke test (Windows PowerShell 5.1)
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./tests/smoke.ps1

      - name: Mocked suites (PowerShell 7)
        shell: pwsh
        run: ./tests/run.ps1

      - name: Live event log smoke test (PowerShell 7)
        shell: pwsh
        run: ./tests/smoke.ps1
